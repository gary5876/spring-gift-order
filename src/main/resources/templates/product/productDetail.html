<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' 상세'">상품 상세</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h2 th:text="${product.name} + ' 상세'"></h2>
<p><strong>가격:</strong> <span th:text="${product.price}"></span>원</p>
<img th:src="${product.imgUrl}" alt="상품 이미지">

<hr>
<h4>옵션 목록</h4>
<ul>
    <li th:each="opt : ${options}">
        <span th:text="${opt.name}"></span>
        - <span th:text="${opt.quantity}"></span>개
    </li>
</ul>

<hr>
<h4>옵션 추가</h4>
<form method="post" th:action="@{'/admin/products/' + ${product.id} + '/options'}">
    <div class="mb-2">
        <label for="name" class="form-label">옵션명</label>
        <input type="text" id="name" name="name" class="form-control" required>
    </div>
    <div class="mb-2">
        <label for="quantity" class="form-label">수량</label>
        <input type="number" id="quantity" name="quantity" class="form-control" required min="1" max="99999999">
    </div>
    <button type="submit" class="btn btn-primary">추가</button>
</form>

<div class="mt-3 text-danger" th:if="${error}" th:text="${error}"></div>
<div class="mt-3 text-success" th:if="${success}" th:text="${success}"></div>
</body>
</html>
