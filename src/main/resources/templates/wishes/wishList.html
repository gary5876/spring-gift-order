<!DOCTYPE html>
<html lang="ko">
<head>
    <title>위시리스트</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .card-header { background-color: #2c3e50; color: white; }
        .card-header h4 { margin: 0; }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h4>위시리스트</h4>
        </div>
        <div class="card-body">
            <form id="add-wish-form" class="row mb-4">
                <div class="col">
                    <input type="number" id="productId" class="form-control" placeholder="상품 ID 입력" required />
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">상품 추가</button>
                </div>
            </form>

            <table class="table table-hover text-center align-middle">
                <thead class="table-light">
                <tr>
                    <th>상품명</th>
                    <th>가격</th>
                    <th>이미지</th>
                    <th>옵션</th>
                    <th>수량</th>
                    <th>작업</th>
                </tr>
                </thead>
                <tbody id="wish-tbody"></tbody>
            </table>

            <nav>
                <ul class="pagination justify-content-center" id="pagination"></ul>
            </nav>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem("accessToken");
    let currentPage = 0;
    const size = 5;

    async function loadWishes(page = 0) {
        currentPage = page;

        const res = await fetch(`/api/wishes?page=${page}&size=${size}`, {
            headers: { "Authorization": "Bearer " + token }
        });

        if (!res.ok) {
            alert("위시리스트 불러오기 실패: " + await res.text());
            return;
        }

        const data = await res.json();
        renderWishes(data.content);
        renderPagination(data.totalPages, data.number);
    }

    function renderWishes(wishes) {
        const tbody = document.getElementById("wish-tbody");
        tbody.innerHTML = "";

        if (wishes.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");
            cell.setAttribute("colspan", "6");
            cell.textContent = "목록에 상품이 없습니다.";
            row.appendChild(cell);
            tbody.appendChild(row);
            return;
        }

        wishes.forEach(product => {
            const row = document.createElement("tr");

            let optionSelectHtml = `<select class="form-select form-select-sm option-select" data-product-id="${product.productId}" onchange="changeOption(${product.productId})">`;
            product.options.forEach(option => {
                const selected = option.optionId === product.optionId ? 'selected' : '';
                optionSelectHtml += `<option value="${option.optionId}" ${selected}>${option.name} (재고: ${option.quantity})</option>`;
            });
            optionSelectHtml += `</select>`;

            row.innerHTML = `
                <td>${product.name}</td>
                <td>${product.price}원</td>
                <td><img src="${product.imgUrl}" alt="상품 이미지" width="80"/></td>
                <td>${optionSelectHtml}</td>
                <td>
                    <input type="number" value="${product.quantity}" min="1"
                        class="form-control form-control-sm quantity-input" data-product-id="${product.productId}" />
                </td>
                <td>
                    <button class="btn btn-primary btn-sm me-1" onclick="changeQuantity(${product.productId})">변경</button>
                    <button class="btn btn-danger btn-sm me-1" onclick="deleteWish(${product.productId})">삭제</button>
                    <button class="btn btn-success btn-sm" onclick="orderProduct(${product.productId})">주문</button>
                </td>
            `;

            tbody.appendChild(row);
        });
    }

    function renderPagination(totalPages, currentPage) {
        const pagination = document.getElementById("pagination");
        pagination.innerHTML = "";

        for (let i = 0; i < totalPages; i++) {
            const li = document.createElement("li");
            li.className = `page-item ${i === currentPage ? 'active' : ''}`;

            const btn = document.createElement("button");
            btn.className = "page-link";
            btn.textContent = i + 1;
            btn.onclick = () => loadWishes(i);

            li.appendChild(btn);
            pagination.appendChild(li);
        }
    }

    async function deleteWish(productId) {
        const res = await fetch(`/api/wishes/${productId}`, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + token }
        });

        if (res.ok) {
            alert("상품이 삭제되었습니다.");
            await loadWishes(currentPage);
        } else {
            alert(`삭제 실패 (${res.status}): ` + await res.text());
        }
    }

    async function changeQuantity(productId) {
        const input = document.querySelector(`input.quantity-input[data-product-id="${productId}"]`);
        const quantity = parseInt(input.value, 10);

        if (isNaN(quantity) || quantity < 1) {
            alert("수량은 1 이상의 숫자여야 합니다.");
            return;
        }

        const res = await fetch(`/api/wishes`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ productId, quantity })
        });

        if (res.ok) {
            alert("수량이 변경되었습니다.");
            await loadWishes(currentPage);
        } else {
            alert("수량 변경 실패: " + await res.text());
        }
    }

    async function changeOption(productId) {
        const select = document.querySelector(`select.option-select[data-product-id="${productId}"]`);
        const optionId = parseInt(select.value, 10);

        const res = await fetch(`/api/wishes/option`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ productId, optionId })
        });

        if (res.ok) {
            alert("옵션이 변경되었습니다.");
            await loadWishes(currentPage);
        } else {
            alert("옵션 변경 실패: " + await res.text());
        }
    }

    async function orderProduct(productId) {
        const quantityInput = document.querySelector(`input.quantity-input[data-product-id="${productId}"]`);
        const optionSelect = document.querySelector(`select.option-select[data-product-id="${productId}"]`);

        const quantity = parseInt(quantityInput.value, 10);
        const optionId = parseInt(optionSelect.value, 10);

        if (isNaN(quantity) || quantity < 1) {
            alert("주문 수량은 1 이상이어야 합니다.");
            return;
        }

        const res = await fetch("/api/orders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({
                productId,
                optionId,
                quantity,
                message: "please handle this order with care"
            })
        });

        if (res.ok) {
            alert("주문이 완료되었습니다. 메시지가 전송되었습니다.");
            await loadWishes(currentPage);
        } else {
            alert(`주문 실패 (${res.status}): ` + await res.text());
        }
    }

    document.getElementById("add-wish-form").addEventListener("submit", async function(e) {
        e.preventDefault();
        const productId = Number(document.getElementById("productId").value);

        const res = await fetch("/api/wishes", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ productId })
        });

        if (res.ok) {
            alert("상품 추가 완료");
            document.getElementById("productId").value = "";
            await loadWishes(currentPage);
        } else {
            alert("상품 추가 실패: " + await res.text());
        }
    });

    window.addEventListener("DOMContentLoaded", () => loadWishes());
</script>
</body>
</html>
