<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>상품 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .card-header {
            background-color: #2c3e50;
            color: white;
        }
        .card-header h4 {
            margin: 0;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4><b>상품</b>관리</h4>
            <div id="button-area"></div>
        </div>
        <div class="card-body">
            <!--검색+정렬-->
            <form class="mb-3 d-flex justify-content-between align-items-center" method="get" th:action="@{/admin/products}">
                <div class="col-md-4">
                    <input type="text" class="form-control" name="name" placeholder="상품명 검색" th:value="${param.name}">
                </div>
                <div class="col-md-4">
                    <select class="form-select" name="sort" onchange="this.form.submit()">
                        <option value="name,asc"
                                th:selected="${param.sort != null and #strings.contains(param.sort, 'name,asc')}">이름 오름차순</option>
                        <option value="name,desc"
                                th:selected="${param.sort != null and #strings.contains(param.sort, 'name,desc')}">이름 내림차순</option>
                        <option value="price,asc"
                                th:selected="${param.sort != null and #strings.contains(param.sort, 'price,asc')}">가격 오름차순</option>
                        <option value="price,desc"
                                th:selected="${param.sort != null and #strings.contains(param.sort, 'price,desc')}">가격 내림차순</option>
                    </select>
                </div>
                <div>
                    <button type="submit" class="btn btn-primary">검색</button>
                </div>
            </form>
            <!--상품 테이블-->
            <table class="table table-hover text-center align-middle">
                <thead class="table-light">
                <tr>
                    <th>상품명</th>
                    <th>가격</th>
                    <th>이미지</th>
                    <th>작업</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.price} + '원'"></td>
                    <td><img th:src="${product.imgUrl}" alt="상품 이미지" width="80"/></td>
                    <td>
                        <a th:href="@{'/admin/products/edit/' + ${product.id}}" class="btn btn-warning btn-sm">수정</a>
                        <a th:href="@{'/admin/products/' + ${product.id}}" class="btn btn-info btn-sm">옵션 관리</a>
                        <form th:action="@{'/admin/products/' + ${product.id}}" th:method="delete" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <!--페이지네이션-->
            <nav th:if="${products.totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/products(page=${products.number - 1}, size=${products.size}, name=${param.name}, sort=${param.sort})}">이전</a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                        th:classappend="${i == products.number} ? 'active'">
                        <a class="page-link"
                           th:href="@{/admin/products(page=${i}, size=${products.size}, name=${param.name}, sort=${param.sort})}"
                           th:text="${i + 1}"></a>
                    </li>

                    <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/products(page=${products.number + 1}, size=${products.size}, name=${param.name}, sort=${param.sort})}">다음</a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</div>

<script>
    function parseJwt(token) {
        try {
            return JSON.parse(atob(token.split('.')[1]));
        } catch (e) {
            return null;
        }
    }

    function createButton(text, href, className = "btn btn-outline-light me-2") {
        const a = document.createElement("a");
        a.href = href;
        a.textContent = text;
        a.className = className;
        return a;
    }

    window.addEventListener("DOMContentLoaded", () => {
        const token = localStorage.getItem("accessToken");
        const buttonArea = document.getElementById("button-area");

        if (!token) {
            buttonArea.appendChild(createButton("로그인", "/admin/members/enter"));
            buttonArea.appendChild(createButton("회원가입", "/admin/members/add"));

            const kakaoBtn = document.createElement("a");
            kakaoBtn.textContent = "카카오 로그인";
            kakaoBtn.href = "/login";
            kakaoBtn.className = "btn btn-warning me-2";
            buttonArea.appendChild(kakaoBtn);

        } else {
            const payload = parseJwt(token);
            const role = payload?.role;

            const wishBtn = document.createElement("button");
            wishBtn.textContent = "위시리스트";
            wishBtn.className = "btn btn-outline-light me-2";
            wishBtn.onclick = async () => {
                const token = localStorage.getItem("accessToken");

                const res = await fetch("/admin/wishes", {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (res.ok) {
                    const html = await res.text();
                    document.open();
                    document.write(html);
                    document.close();
                } else {
                    alert("찜 목록 조회 실패: " + (await res.text()));
                }
            };
            buttonArea.appendChild(wishBtn);


            if (role === "ADMIN") {
                buttonArea.appendChild(createButton("회원관리", "/admin/members"));
            }

            buttonArea.appendChild(createButton("새 상품 추가", "/admin/products/new", "btn btn-success me-2"));

            const logoutBtn = document.createElement("button");
            logoutBtn.textContent = "로그아웃";
            logoutBtn.className = "btn btn-danger";
            logoutBtn.onclick = () => {
                localStorage.removeItem("accessToken");
                alert("로그아웃 되었습니다.");
                location.reload();
            };
            buttonArea.appendChild(logoutBtn);
        }
    });
</script>
</body>
</html>
