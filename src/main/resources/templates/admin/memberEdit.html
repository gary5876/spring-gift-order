<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">회원 수정</h2>

    <form th:action="@{'/admin/members/edit/' + ${memberId}}" method="post" th:object="${memberRequest}">
        <div class="mb-3">
            <label class="form-label">이메일</label>
            <input type="email" th:field="*{email}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">비밀번호</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="수정하지 않으려면 비워두세요" />
        </div>
        <button type="submit" class="btn btn-primary">수정 완료</button>
        <a th:href="@{/admin/members}" class="btn btn-secondary">취소</a>
    </form>
</div>
</body>
</html>
